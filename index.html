<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>किसान सेतु - डायरेक्ट फार्म टू कंज्यूमर मार्केटप्लेस</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">किसान सेतु</div>
    <nav>
        <a href="#">होम</a>
        <a href="#market">मार्केटप्लेस</a>
        <a href="#">डैशबोर्ड</a>
        <a href="#" class="btn-login">लॉगिन</a>
    </nav>
</header>

<section class="hero">
    <h1>खेत से सीधे आपके दरवाजे तक।</h1>
    <p>किसानों को सीधे खरीदारों से जोड़ने का नया तरीका।</p>
    <a href="#market" class="btn-primary">ताजी फसलें देखें</a>
</section>

<section class="marketplace" id="market">
    <h2>उपलब्ध फसलें</h2>
    <div class="grid">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?auto=format&fit=crop&q=80&w=800" alt="ऑर्गेनिक गेहूं">
            <div class="card-body">
                <h3>ऑर्गेनिक गेहूं</h3>
                <p class="card-price">₹32 / किग्रा</p>
                <p>क्वालिटी: ग्रेड A | लोकेशन: पंजाब</p>
                <button class="btn-secondary">विवरण देखें</button>
            </div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1620574387735-3624d75b2dbc?auto=format&fit=crop&q=80&w=800" alt="लाल प्याज">
            <div class="card-body">
                <h3>लाल प्याज</h3>
                <p class="card-price">₹25 / किग्रा</p>
                <p>क्वालिटी: प्रीमियम | लोकेशन: महाराष्ट्र</p>
                <button class="btn-secondary">विवरण देखें</button>
            </div>
        </div>
    </div>
</section>

</body>
</html>
